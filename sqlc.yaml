version: "2"
sql:
  - engine: "postgresql"
    # The migrations ARE the schema. sqlc reads the .up.sql files and ignores
    # the .down.sql ones, so a query referencing a column with no migration
    # behind it fails to generate rather than failing at runtime.
    schema: "internal/db/migrations"
    queries: "internal/db/query"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"

        emit_json_tags: true
        json_tags_case_style: "snake"
        # Nullable columns become Go pointers, so they marshal to JSON null
        # rather than to a pgtype wrapper object.
        emit_pointers_for_null_types: true
        # A list query with no rows returns [] rather than nil, which encodes as
        # a JSON array instead of null.
        emit_empty_slices: true
        emit_prepared_queries: false
        emit_interface: false

        # Postgres enum types generate as Go string types with per-value
        # constants; nothing to declare here.
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          - db_type: "date"
            go_type: "time.Time"
          - db_type: "date"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true

          # numeric is deliberately NOT overridden to float64. It maps to
          # pgtype.Numeric, which is exact and JSON-marshals as a number.
          # Money through a float is how rounding errors get into a ledger.
