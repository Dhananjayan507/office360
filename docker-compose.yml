services:
  postgres:
    image: postgres:16-alpine
    container_name: office360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-office360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-office360_dev}
      POSTGRES_DB: ${POSTGRES_DB:-office360}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - office360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-office360} -d ${POSTGRES_DB:-office360}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  office360_pgdata:
